name: Shulker Peek Android test APK
run-name: Shulker Peek test · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [shulker-peek-android]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - 'packaging/android/**'
      - 'tools/**'
      - 'mods/**'
      - 'third_party/**'
      - '.github/workflows/shulker-peek-apk.yml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read
concurrency:
  group: shulker-peek-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 8.14
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            https://downloads.gradle.org/distributions/gradle-8.14-bin.zip \
            --output "$RUNNER_TEMP/gradle/gradle-8.14-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle/gradle-8.14-bin.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.14/bin" >> "$GITHUB_PATH"
      - name: Install Android and Rust toolchains
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          rustup target add aarch64-linux-android
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: shulker-android-${{ runner.os }}-arm64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            shulker-android-${{ runner.os }}-arm64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Prepare Android engine inputs
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build ARM64 Android APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Collect APK and checksum
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          out = Path('dist')
          out.mkdir()
          apk = out / 'Shulker-Peek-Horizon-0.7.8-arm64.apk'
          shutil.copyfile(Path('.local/android/apk/arm64-v8a/horizon-android-public.apk'), apk)
          (out / 'SHA256SUMS.txt').write_text(f'{hashlib.sha256(apk.read_bytes()).hexdigest()}  {apk.name}\\n')
          (out / 'BUILD.json').write_text(json.dumps({
              'commit': '${{ github.sha }}',
              'abi': 'arm64-v8a',
              'package': 'dev.horizon.android.dev',
              'experimental': True
          }, indent=2) + '\\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shulker-peek-horizon-0.7.8-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14
